name: Activate fal.ai media generation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: braand-production
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BRAAND_PROVIDER_DEPLOY_TOKEN || secrets.BRAAND_DEPLOY_ONCE }}
      CLOUDFLARE_ACCOUNT_ID: 2ead1748668417f67d184d93a3fd69ec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Mark the funded fal.ai account as ready
        run: node scripts/activate-fal.mjs
      - name: Check production health
        run: |
          sleep 10
          curl --fail --silent --show-error https://braand.fun/api/health
