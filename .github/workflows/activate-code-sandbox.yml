name: Activate the code sandbox (GitHub projects and live previews)
# Requires Workers Paid (Cloudflare Containers). Run it once after enabling the plan;
# running it again rotates the shared secrets and redeploys the sandbox image.
on:
  workflow_dispatch:
    inputs:
      refresh_only:
        description: Publish verified runtime changes while preserving existing secrets
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BRAAND_PROVIDER_DEPLOY_TOKEN || secrets.BRAAND_DEPLOY_ONCE }}
      CLOUDFLARE_ACCOUNT_ID: 2ead1748668417f67d184d93a3fd69ec
      BRAAND_PRODUCTION_CODE_SANDBOX_INTERNET: 'true'
      BRAAND_PRODUCTION_CODE_SANDBOX_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --include=dev --include=optional
      - name: Build and deploy the sandbox Worker and its container image
        run: |
          node services/code-sandbox/prepare-config.mjs production
          npx --yes wrangler@4.158.0 deploy --config .wrangler/deploy/code-sandbox-production.json --keep-vars
      - name: Share fresh secrets and bind the sandbox to Braand
        if: ${{ !inputs.refresh_only }}
        run: |
          export CODE_SANDBOX_CALL_TOKEN=$(openssl rand -hex 32)
          export CODE_PREVIEW_SECRET=$(openssl rand -hex 32)
          node scripts/activate-code-sandbox.mjs
      - name: Check production health and the preview address
        run: |
          sleep 15
          curl --fail --silent --show-error https://braand.fun/api/health
