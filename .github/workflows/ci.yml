name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional
      - name: Check all TypeScript
        run: npm run typecheck
      - name: Lint all source and tests
        run: npm run lint
      - name: Build production Worker and browser assets
        run: npm run build
      - name: Run unit, service, browser bundle, file and HTTP tests offline
        run: npm test
      - name: Prepare isolated browser checks on the GitHub runner
        run: |
          npm install --prefix "$RUNNER_TEMP/braand-browser" --no-package-lock --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/braand-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check desktop and mobile interactions without providers
        env:
          BRAAND_PLAYWRIGHT_MODULE: ${{ runner.temp }}/braand-browser/node_modules/playwright/index.mjs
        run: |
          node tests/agent-ui.browser.mjs
          node tests/auth-ui.browser.mjs
          node tests/routines-ui.browser.mjs
      - name: Keep fixture screenshots online
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-fixture-screenshots
          path: |
            .tmp/agent-ui-browser/*.png
            .tmp/auth-ui/*.png
            .tmp/routines-ui/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Save the verified production build
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/global-workflow' || github.ref == 'refs/heads/feat/system-agent-context' || github.ref == 'refs/heads/fix/credits-postpaid'
        uses: actions/upload-artifact@v4
        with:
          name: verified-production-build
          path: dist/
          include-hidden-files: true
          retention-days: 1
      - name: Deploy the reviewed chat and billing correction
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/chat-routing-credit-settlement'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BRAAND_DEPLOY_ONCE }}
          CLOUDFLARE_ACCOUNT_ID: 2ead1748668417f67d184d93a3fd69ec
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Build and tests completed. Deployment awaits the temporary Cloudflare credential."
            exit 0
          fi
          node scripts/prepare-production-deploy.mjs
          npx --no-install wrangler deploy --config .wrangler/deploy/production-live.json --no-x-provision --keep-vars --message "Verified chat and billing fix ${GITHUB_SHA}"
          curl --fail --silent --show-error https://braand.fun/api/health
          curl --fail --silent --show-error "https://braand.fun/api/health?check=assistant"
      - name: Deploy the verified personal agent system
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/system-agent-context'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BRAAND_DEPLOY_ONCE }}
          CLOUDFLARE_ACCOUNT_ID: 2ead1748668417f67d184d93a3fd69ec
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/prepare-production-deploy.mjs
          npx --no-install wrangler deploy --config .wrangler/deploy/production-live.json --no-x-provision --keep-vars --message "Verified personal agent system ${GITHUB_SHA}"
          curl --fail --silent --show-error https://braand.fun/api/health
          node --input-type=module -e 'const r=await fetch("https://braand.fun/api/health?check=assistant");const b=await r.json();if(!r.ok||!b.assistantReady||b.agentSystemVersion!=="braand-personal-agent-v2")throw Error("Assistant system readiness not confirmed");console.log(JSON.stringify(b));'
  deploy-postpaid:
    name: Publish verified credit billing correction
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/credits-postpaid'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: braand-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BRAAND_DEPLOY_ONCE }}
      CLOUDFLARE_ACCOUNT_ID: 2ead1748668417f67d184d93a3fd69ec
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --include=optional
      - uses: actions/download-artifact@v4
        with:
          name: verified-production-build
          path: dist
      - name: Verify production provenance and deploy
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/prepare-production-deploy.mjs
          npx --no-install wrangler deploy --config .wrangler/deploy/production-live.json --no-x-provision --keep-vars --message "Verified credit settlement ${GITHUB_SHA}"
          curl --fail --silent --show-error https://braand.fun/api/health
          curl --fail --silent --show-error "https://braand.fun/api/health?check=assistant"
