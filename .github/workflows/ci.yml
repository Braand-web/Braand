name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      release_providers:
        description: Verify Browserbase and Firecrawl, then publish this revision
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional
      - name: Check all TypeScript
        run: npm run typecheck
      - name: Lint all source and tests
        run: npm run lint
      - name: Build production Worker and browser assets
        run: npm run build
      - name: Run unit, service, browser bundle, file and HTTP tests offline
        run: npm test
      - name: Prepare isolated browser checks on the GitHub runner
        run: |
          npm install --prefix "$RUNNER_TEMP/braand-browser" --no-package-lock --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/braand-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check desktop and mobile interactions without providers
        env:
          BRAAND_PLAYWRIGHT_MODULE: ${{ runner.temp }}/braand-browser/node_modules/playwright/index.mjs
        run: |
          node tests/agent-ui.browser.mjs
          node tests/rich-response.browser.mjs
          node tests/auth-ui.browser.mjs
          node tests/routines-ui.browser.mjs
          node tests/browser-live-vault-ui.browser.mjs
      - name: Keep fixture screenshots online
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-fixture-screenshots
          path: |
            .tmp/agent-ui-browser/*.png
            .tmp/auth-ui/*.png
            .tmp/routines-ui/*.png
            .tmp/browser-live-vault-ui/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Save the verified production build
        uses: actions/upload-artifact@v4
        with:
          name: verified-production-build
          path: dist/
          include-hidden-files: true
          retention-days: 1
  provider_proof:
    name: Real provider checks on a disposable fixture
    if: github.event_name == 'workflow_dispatch' && inputs.release_providers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BRAAND_PROVIDER_DEPLOY_TOKEN || secrets.BRAAND_DEPLOY_ONCE }}
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: 2ead1748668417f67d184d93a3fd69ec
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --include=optional
      - name: Verify real public provider operations
        run: node scripts/verify-web-providers-live.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-provider-proof
          path: .tmp/web-provider-proof.json
          include-hidden-files: true
          retention-days: 1
  deploy:
    name: Publish verified main source
    needs: [verify, provider_proof]
    if: always() && needs.verify.result == 'success' && (needs.provider_proof.result == 'success' || needs.provider_proof.result == 'skipped') && ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.ref == 'refs/heads/feat/browserbase-firecrawl' && github.event_name == 'workflow_dispatch' && inputs.release_providers))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: braand-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BRAAND_PROVIDER_DEPLOY_TOKEN || secrets.BRAAND_DEPLOY_ONCE }}
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: 2ead1748668417f67d184d93a3fd69ec
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --include=optional
      - uses: actions/download-artifact@v4
        with:
          name: verified-production-build
          path: dist
      - uses: actions/download-artifact@v4
        if: inputs.release_providers
        with:
          name: web-provider-proof
          path: .tmp
      - name: Preserve live changes and publish the tested build
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/prepare-production-deploy.mjs
          npx --no-install wrangler deploy --config .wrangler/deploy/production-live.json --no-x-provision --keep-vars --message "Verified production ${GITHUB_SHA}"
          curl --fail --silent --show-error https://braand.fun/api/health
          node scripts/check-production-brain.mjs
      - name: Publish the isolated sites Worker
        # A sites failure must not undo the verified app deploy; it is reported in the run.
        continue-on-error: true
        run: |
          node scripts/prepare-sites-deploy.mjs
          npx --no-install wrangler deploy --config .wrangler/deploy/sites.json --message "Sites ${GITHUB_SHA}" 2>&1 | node scripts/record-sites-origin.mjs
      - name: Activate the verified provider integrations
        if: inputs.release_providers
        run: |
          node scripts/configure-web-providers.mjs
          curl --fail --silent --show-error https://braand.fun/api/health
          curl --fail --silent --show-error 'https://braand.fun/api/health?check=assistant'
  deploy-postpaid:
    name: Publish verified credit billing correction
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/credits-postpaid'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: braand-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BRAAND_DEPLOY_ONCE }}
      CLOUDFLARE_ACCOUNT_ID: 2ead1748668417f67d184d93a3fd69ec
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --include=optional
      - uses: actions/download-artifact@v4
        with:
          name: verified-production-build
          path: dist
      - name: Verify production provenance and deploy
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/prepare-production-deploy.mjs
          npx --no-install wrangler deploy --config .wrangler/deploy/production-live.json --no-x-provision --keep-vars --message "Verified credit settlement ${GITHUB_SHA}"
          curl --fail --silent --show-error https://braand.fun/api/health
          curl --fail --silent --show-error "https://braand.fun/api/health?check=assistant"


